name: V02 Build Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [build/v02-language-runtime]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compiler regression tests
        working-directory: COMPILER
        run: npm test
      - name: Adapter regression tests
        working-directory: ADAPTER
        run: npm test
      - name: Governance regression tests
        working-directory: ADAPTER
        run: node --test test/governance.test.js
      - name: V-01 regression tests
        working-directory: VERTICAL_SLICE/v01
        run: npm test
      - name: V-02 language-runtime harness
        working-directory: VERTICAL_SLICE/v02
        run: npm test
